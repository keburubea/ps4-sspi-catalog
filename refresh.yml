name: Refresh catalog

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - generate_static_catalog.py
      - config.yaml
      - requirements.txt
      - .github/workflows/refresh.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # keeps downloaded cover art between runs so archive.org isn't re-hit every day
      - uses: actions/cache@v4
        with:
          path: .cache
          key: ia-cache-${{ github.run_id }}
          restore-keys: ia-cache-

      # exits non-zero (and therefore does NOT deploy) if the catalog looks damaged
      - run: python generate_static_catalog.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
